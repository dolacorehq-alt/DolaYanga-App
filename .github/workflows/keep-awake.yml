name: Keep DolaYanga Awake

on:
  schedule:
    - cron: '0 */10 * * *'   # Every 10 hours
  workflow_dispatch:         # Allows manual run

# Important: Give permission to push changes
permissions:
  contents: write

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create keep-alive commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions"
          
          # Update timestamp file
          echo "Last keep-alive: $(date -u)" > .github/keep-alive.txt
          
          git add .github/keep-alive.txt
          git commit -m "Keep-alive: $(date -u)" || echo "No changes to commit (already up to date)"
          git push
